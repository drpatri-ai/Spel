<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bucinca Schack</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bucinca">
<meta name="theme-color" content="#8B7BFF">
<style>
@font-face{font-family:'Fredoka';src:url('fonts/fredoka.woff2') format('woff2');font-weight:300 700;font-display:block}
:root{
  --ink:#2B2350; --muted:#6B6390; --card:#ffffffee;
  --light:#FFF4DA; --dark:#8FB8FF; --frame:#2A4FC4;
  --safe-t:max(14px,env(safe-area-inset-top)); --safe-b:max(14px,env(safe-area-inset-bottom));
  --safe-l:max(14px,env(safe-area-inset-left)); --safe-r:max(14px,env(safe-area-inset-right));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);touch-action:manipulation}
body{background:linear-gradient(160deg,#FFB3D9 0%,#C9A7FF 45%,#7FD1FF 100%)}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
img{-webkit-user-drag:none}

#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#bg i{position:absolute;bottom:-120px;border-radius:50%;background:#ffffff33;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-130vh) translateX(var(--dx))}}

.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);gap:14px}
.screen.on{display:flex;animation:screenIn .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes screenIn{from{opacity:0;transform:scale(.94)}}
.scroll{overflow-y:auto;justify-content:flex-start}

.btn{--c:#FF8A3D;--d:#D9621A;background:var(--c);color:#fff;font-size:clamp(18px,4.6vmin,26px);font-weight:600;
  padding:14px 26px;border-radius:22px;box-shadow:0 6px 0 var(--d),0 10px 20px #0002;transition:transform .08s,box-shadow .08s;
  display:flex;align-items:center;justify-content:center;gap:10px;min-width:min(78vw,340px)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d),0 4px 10px #0002}
.btn.green{--c:#34C759;--d:#219A40}.btn.purple{--c:#8B7BFF;--d:#6252D9}.btn.pink{--c:#FF6FAE;--d:#D94788}
.btn.blue{--c:#3B9DFF;--d:#2373C9}.btn.white{--c:#fff;--d:#C9C3E8;color:var(--ink)}
.btn.small{min-width:0;font-size:clamp(15px,3.6vmin,20px);padding:10px 16px;border-radius:16px}
.btn:disabled{filter:grayscale(.8);opacity:.55}
.ibtn{width:48px;height:48px;border-radius:16px;background:var(--card);font-size:24px;box-shadow:0 4px 0 #C9C3E8;display:grid;place-items:center;flex:none}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 #C9C3E8}
.topbar{position:absolute;top:var(--safe-t);left:var(--safe-l);right:var(--safe-r);display:flex;justify-content:space-between;align-items:center;z-index:5}
h2{margin:0;font-size:clamp(24px,6vmin,38px);text-align:center;text-shadow:0 3px 0 #fff8}

.logo{display:flex;flex-direction:column;align-items:center;font-weight:700;line-height:1;margin-bottom:6px}
.logo>div{display:flex;gap:2px}
.logo .l1{font-size:clamp(46px,14vmin,104px)}
.logo .l2{font-size:clamp(40px,12vmin,90px);margin-top:4px}
.logo span{display:inline-block;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;animation:bob 1.6s ease-in-out infinite;text-shadow:0 6px 0 var(--ink)}
.logo .sp{width:.3em}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.dance{display:flex;flex-wrap:wrap;justify-content:center;gap:min(2.5vw,14px);margin:6px 0 10px;max-width:96vw}
.dance .av{width:clamp(40px,8.5vmin,70px);animation:hop 1.2s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-16px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}}
.menu{display:flex;flex-direction:column;gap:16px;align-items:center}

.av{aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--c,#ccc);border:4px solid var(--c,#fff);box-shadow:0 5px 0 var(--d,#0003);flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}

.levels{display:flex;flex-direction:column;gap:16px;align-items:center}
.levels .btn{flex-direction:column;gap:0;padding:12px 26px}
.levels .btn small{font-size:.62em;font-weight:400;opacity:.92}

.chars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(96vw,560px)}
@media (min-aspect-ratio:5/4){.chars{grid-template-columns:repeat(5,minmax(0,1fr));width:min(96vw,1000px)}}
.screen:has(.chars){overflow-y:auto;justify-content:safe center}
.char{background:var(--card);border-radius:26px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 6px 0 #C9C3E8;position:relative;transition:transform .15s}
.char .av{width:min(66%,17dvh)}
.char b{font-size:clamp(14px,3.4vmin,20px)}
.char:active{transform:scale(.96)}
.char.taken{opacity:.45;filter:grayscale(.6)}
.char.taken::after{content:attr(data-tag);position:absolute;top:10px;right:10px;background:var(--ink);color:#fff;font-size:13px;padding:3px 9px;border-radius:10px}
.char.pick{animation:picked .5s}
@keyframes picked{40%{transform:scale(1.12) rotate(-4deg)}}
.hint-txt{color:var(--muted);font-size:clamp(14px,3.4vmin,18px);margin:0;text-align:center}

/* ---------- spelet ---------- */
#game{justify-content:flex-start;gap:8px}
.gtop{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.round{background:var(--card);padding:8px 16px;border-radius:14px;font-weight:600;font-size:clamp(15px,3.6vmin,20px)}
.arena{flex:1;width:100%;display:grid;grid-template-columns:1fr;grid-template-areas:"top" "board" "bot";
  grid-template-rows:auto auto auto;align-content:center;justify-items:center;gap:10px;min-height:0}
#pcTop{grid-area:top}#pcBot{grid-area:bot}
.pc{background:var(--card);border-radius:22px;padding:8px 12px;display:flex;align-items:center;gap:10px;width:min(100%,560px);
  position:relative;border:4px solid transparent;transition:transform .25s,border-color .25s,box-shadow .25s;box-shadow:0 5px 0 #C9C3E8}
.pc .av{width:clamp(44px,11vmin,74px)}
.pc .info{display:flex;flex-direction:column;min-width:0;flex:1}
.pc .nm{font-weight:600;font-size:clamp(15px,3.8vmin,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .tag{font-size:clamp(12px,2.8vmin,15px);color:var(--muted)}
.pc .caps{display:flex;flex-wrap:wrap;align-items:center;min-height:20px}
.pc .caps svg{width:clamp(16px,3.6vmin,24px);height:clamp(16px,3.6vmin,24px);margin-right:-4px;overflow:visible}
.pc .caps b{margin-left:8px;font-size:clamp(13px,3vmin,16px);color:var(--c)}
.pc .sc{font-size:clamp(26px,6.5vmin,40px);font-weight:700;color:var(--c)}
.pc.turn{border-color:var(--c);transform:scale(1.03);box-shadow:0 5px 0 var(--d),0 0 0 6px color-mix(in srgb,var(--c) 30%,transparent)}
.pc.turn .av{animation:hop 1.2s ease-in-out infinite}
.pc.thinking .av{animation:think 1s ease-in-out infinite}
@keyframes think{50%{transform:rotate(-12deg) scale(1.05)}}
.pc.happy .av{animation:wiggle .5s ease-in-out 4}
@keyframes wiggle{25%{transform:rotate(-14deg) scale(1.15)}75%{transform:rotate(14deg) scale(1.15)}}
.pc.sad .av{filter:grayscale(.5);transform:rotate(-8deg)}
.bubble{position:absolute;left:50%;transform:translate(-50%,0) scale(0);background:#fff;color:var(--ink);
  font-weight:600;padding:8px 14px;border-radius:16px;white-space:nowrap;font-size:clamp(14px,3.4vmin,18px);z-index:20;
  box-shadow:0 6px 16px #0003;transition:transform .25s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
#pcTop .bubble{top:calc(100% + 10px);transform-origin:top center}
#pcBot .bubble{bottom:calc(100% + 10px);transform-origin:bottom center}
.bubble::before{content:"";position:absolute;left:50%;margin-left:-9px;border:9px solid transparent}
#pcTop .bubble::before{top:-8px;border-top:0;border-bottom-color:#fff}
#pcBot .bubble::before{bottom:-8px;border-bottom:0;border-top-color:#fff}
.bubble.show{transform:translate(-50%,0) scale(1)}

.bwrap{grid-area:board;--bw:min(94vw,calc(100dvh - 330px),760px);width:var(--bw);position:relative}
.board{position:relative;width:100%;aspect-ratio:1;border-radius:18px;overflow:hidden;border:6px solid var(--frame);
  box-shadow:0 8px 0 color-mix(in srgb,var(--frame) 70%,#000),0 16px 28px #0004;background:var(--frame)}
.squares{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.sq{position:relative;background:var(--light)}
.sq.dk{background:var(--dark)}
.sq .lbl{position:absolute;font-size:calc(var(--bw) / 48);font-weight:600;opacity:.6;line-height:1;pointer-events:none}
.sq .lr{top:4%;left:5%}.sq .lf{bottom:4%;right:6%}
.sq.dk .lbl{color:var(--light)}.sq:not(.dk) .lbl{color:color-mix(in srgb,var(--dark) 80%,#000)}
.sq.last::after{content:"";position:absolute;inset:0;background:#FFD93D88}
.sq.sel::after{content:"";position:absolute;inset:0;background:#FFD93D;box-shadow:inset 0 0 0 4px #F5B400}
.sq.hint::after{content:"";position:absolute;inset:0;background:#7CF0A6;animation:hintp .5s ease-in-out infinite alternate}
@keyframes hintp{to{opacity:.4}}
.sq.chk::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#FF3B5Ccc 0%,#FF3B5C66 45%,transparent 75%);animation:hintp .45s ease-in-out infinite alternate}
.sq .dot{position:absolute;left:35%;top:35%;width:30%;height:30%;border-radius:50%;background:#2B235044;z-index:3;pointer-events:none;animation:dotIn .2s}
.sq .ring{position:absolute;inset:4%;border-radius:50%;border:calc(var(--bw) / 90) solid #2B235050;z-index:3;pointer-events:none;animation:dotIn .2s}
@keyframes dotIn{from{transform:scale(0)}}
.pieces{position:absolute;inset:0;pointer-events:none;z-index:2}
.pc-el{position:absolute;width:12.5%;height:12.5%;padding:.5%;transition:filter .2s}
.pc-el>svg{width:100%;height:100%;overflow:visible;display:block;filter:drop-shadow(0 calc(var(--bw) / 200) 0 #0004)}
.pc-el .face{position:absolute;left:29.5%;top:12.5%;width:41%;height:41%;border-radius:50%;object-fit:cover;border:calc(var(--bw) / 260) solid #fff}
.pc-el.lift{transform:translateY(-8%) scale(1.12);z-index:4;filter:drop-shadow(0 8px 6px #0004)}
.pc-el.gone{animation:gone .45s ease-in forwards;z-index:3}
@keyframes gone{30%{transform:scale(1.25) rotate(-12deg)}100%{transform:scale(0) rotate(40deg);opacity:0}}
.board.over .pc-el{filter:saturate(.7) brightness(.85)}
.board.over .pc-el.winner-k{filter:none;animation:glow .7s ease-in-out infinite alternate;z-index:5}
@keyframes glow{to{transform:scale(1.18)}}

.gbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hintn{background:#fff;color:#2373C9;border-radius:9px;padding:0 7px;font-size:.8em}

@media (min-aspect-ratio:5/4){
  .arena{grid-template-columns:1fr auto 1fr;grid-template-areas:"top board bot";grid-template-rows:1fr;align-items:center}
  .pc{flex-direction:column;max-width:240px;padding:14px 12px;text-align:center}
  .pc .info{align-items:center;flex:none}
  .pc .caps{justify-content:center}
  .pc .av{width:clamp(64px,15vmin,120px)}
  #pcBot .bubble{top:calc(100% + 10px);bottom:auto;transform-origin:top center}
  #pcBot .bubble::before{top:-8px;bottom:auto;border:9px solid transparent;border-top:0;border-bottom-color:#fff}
  .bwrap{--bw:min(calc(100dvh - 160px),calc(100vw - 420px),900px)}
}
@media (min-aspect-ratio:5/4) and (max-height:560px){
  #game{padding-top:8px;padding-bottom:8px}
  .gtop{position:absolute;top:8px;left:var(--safe-l);right:var(--safe-r);width:auto;pointer-events:none;z-index:4}
  .gtop>*{pointer-events:auto}
  .round{display:none}
  .gbtns{position:absolute;right:var(--safe-r);bottom:8px;flex-direction:column;z-index:4}
  .gbtns .btn{font-size:14px;padding:8px 12px}
  .pc{max-width:170px;padding:10px 8px;gap:6px}
  .pc .av{width:clamp(44px,14vmin,72px)}
  #pcBot{margin-bottom:150px}
  .bwrap{--bw:min(calc(100dvh - 30px),calc(100vw - 400px))}
}

/* paneler */
.overlay{position:fixed;inset:0;background:#2B235088;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.panel{background:#fff;border-radius:32px;padding:26px 24px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;
  width:min(92vw,440px);max-height:92dvh;overflow-y:auto;box-shadow:0 12px 0 #C9C3E8,0 20px 40px #0004;animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.5) rotate(-6deg);opacity:0}}
.win-av{position:relative;width:min(44vw,180px);margin-top:20px}
.win-av .av{width:100%;animation:wiggle .6s ease-in-out infinite}
.crown{position:absolute;top:-34%;left:50%;transform:translateX(-50%) rotate(-10deg);font-size:min(16vw,64px);animation:bob 1s ease-in-out infinite}
.panel h3{margin:0;font-size:clamp(26px,7vmin,40px);text-align:center;line-height:1.1}
.panel p{margin:0;color:var(--muted);text-align:center;font-size:18px}
.score-big{font-size:34px;font-weight:700;display:flex;gap:16px;align-items:center}
.promo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.promo button{background:#F4F1FF;border-radius:18px;padding:8px;aspect-ratio:1;box-shadow:0 5px 0 #C9C3E8;position:relative}
.promo button:active{transform:translateY(3px)}
.promo svg{width:100%;height:100%;overflow:visible;display:block}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

/* vinstfirande */
#party{position:fixed;inset:0;z-index:65;display:none;overflow:hidden;
  background:radial-gradient(circle at 50% 62%,color-mix(in srgb,var(--c) 55%,#fff) 0%,var(--c) 45%,var(--d) 100%)}
#party.on{display:block;animation:fade .3s}
#party.out{animation:partyOut .45s forwards}
@keyframes partyOut{to{opacity:0;transform:scale(1.08)}}
#party .rays{position:absolute;left:50%;top:62%;width:220vmax;height:220vmax;
  background:repeating-conic-gradient(#ffffff38 0 9deg,transparent 9deg 18deg);transform:translate(-50%,-50%);animation:spin 10s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
#party .ptitle{position:absolute;top:max(5%,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:2px;
  font-size:clamp(38px,11vmin,96px);font-weight:700;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);z-index:3;padding:0 12px}
#party .ptitle span{display:inline-block;animation:letterIn .5s cubic-bezier(.2,1.8,.4,1) both,bob 1.2s ease-in-out .9s infinite}
#party .ptitle .sp{width:.3em}
@keyframes letterIn{from{transform:translateY(-120%) scale(.3) rotate(-20deg);opacity:0}}
#party .psub{position:absolute;top:calc(max(5%,env(safe-area-inset-top)) + clamp(50px,14vmin,118px));left:0;right:0;text-align:center;color:#fff;
  font-weight:700;font-size:clamp(20px,5vmin,40px);text-shadow:0 3px 0 #0004;z-index:3;animation:fade .5s .8s both}
#party .pfig{position:absolute;left:50%;bottom:4dvh;height:min(62dvh,120vw);transform:translateX(-50%);
  animation:figIn .8s cubic-bezier(.2,1.5,.4,1) both;display:flex;justify-content:center}
@keyframes figIn{0%{transform:translateX(-50%) translateY(110%) scale(.6) rotate(-12deg)}100%{transform:translateX(-50%)}}
#party .pjump{position:relative;height:100%;transform-origin:50% 100%;animation:jump .8s ease-in-out .8s infinite}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}12%{transform:translateY(0) scale(1.06,.92)}
  45%{transform:translateY(-13%) scale(.97,1.04) rotate(-5deg)}75%{transform:translateY(0) scale(1.04,.95) rotate(4deg)}}
#party .pjump img{height:100%;max-width:92vw;object-fit:contain;display:block}
#party .pjump img:not(.photo){filter:drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(0 14px 20px #0005)}
#party .pjump img.photo{height:auto;max-height:100%;margin-top:auto;border-radius:28px;border:6px solid #fff;box-shadow:0 14px 30px #0005}
#party .pshadow{position:absolute;bottom:-2%;left:50%;width:70%;height:5%;transform:translateX(-50%);border-radius:50%;background:#0003;animation:shadow .8s ease-in-out .8s infinite}
@keyframes shadow{45%{transform:translateX(-50%) scale(.7);opacity:.5}}
#party .star{position:absolute;left:50%;top:40%;font-size:clamp(28px,7vmin,56px);z-index:2;opacity:0;animation:orbit 1.8s ease-out infinite}
@keyframes orbit{0%{transform:translate(-50%,-50%) rotate(var(--a)) translateX(10%) scale(.3);opacity:0}
  25%{opacity:1}100%{transform:translate(-50%,-50%) rotate(calc(var(--a) + 60deg)) translateX(min(42vw,30dvh)) rotate(calc(-1 * var(--a))) scale(1.2);opacity:0}}
#party .pskip{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;font-weight:600;opacity:.8;margin:0;
  text-shadow:0 2px 0 #0004;animation:fade 1s 1.5s both}

/* inställningar & statistik */
.list{width:min(94vw,620px);display:flex;flex-direction:column;gap:12px;margin-top:64px;padding-bottom:20px}
.row{background:var(--card);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 5px 0 #C9C3E8}
.row .grow{flex:1;min-width:0}
.row h4{margin:0 0 4px;font-size:20px}
.row p.small-note{margin:0;font-size:14px;color:var(--muted)}
.row .av{width:64px;cursor:pointer}
.row input[type=text]{width:100%;font:inherit;font-size:19px;font-weight:600;border:3px solid #E4E0F7;border-radius:14px;padding:6px 10px;color:var(--ink);-webkit-user-select:text;user-select:text}
.row .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.toggle{width:62px;height:36px;border-radius:20px;background:#D6D1EE;position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:left .2s}
.toggle.on{background:#34C759}.toggle.on::after{left:30px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:12px;border:4px solid #fff;box-shadow:0 0 0 2px #D6D1EE;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;padding:0}
.sw i{display:block}
.sw.on{box-shadow:0 0 0 4px var(--ink)}
.sec{font-weight:700;font-size:18px;margin:8px 4px 0;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:18px}
td,th{padding:6px 4px;text-align:center}
th{color:var(--muted);font-weight:500;font-size:15px}
td:first-child,th:first-child{text-align:left}
.bar{height:12px;border-radius:6px;background:var(--c);min-width:4px}
</style>
</head>
<body>
<div id="bg"></div>

<section id="menu" class="screen">
  <div class="logo" id="logo"></div>
  <div class="dance" id="dance"></div>
  <div class="menu">
    <button class="btn green" data-go="2p">👫 Två spelare</button>
    <button class="btn" data-go="bot">🤖 Mot datorn</button>
    <button class="btn purple" data-go="stats">🏆 Statistik</button>
    <button class="btn pink" data-go="settings">⚙️ Inställningar</button>
    <button class="btn white" id="toHub">🏠 Alla spel</button>
  </div>
</section>

<section id="level" class="screen">
  <div class="topbar"><button class="ibtn" data-back>⬅️</button></div>
  <h2>Hur svårt ska det vara?</h2>
  <div class="levels">
    <button class="btn green" data-level="easy">🐣 Lätt<small>Perfekt för att lära sig</small></button>
    <button class="btn" data-level="medium">🦊 Medel<small>Tar pjäser och ser hot</small></button>
    <button class="btn pink" data-level="hard">🦁 Svår<small>Tänker 6–7 drag framåt</small></button>
  </div>
</section>

<section id="select" class="screen">
  <div class="topbar"><button class="ibtn" data-back>⬅️</button></div>
  <h2 id="selTitle">Välj figur</h2>
  <p class="hint-txt" id="selSub"></p>
  <div class="chars" id="chars"></div>
</section>

<section id="game" class="screen">
  <div class="gtop">
    <button class="ibtn" id="gHome">🏠</button>
    <div class="round" id="roundLbl">Parti 1</div>
    <button class="ibtn" id="gSound">🔊</button>
  </div>
  <div class="arena">
    <div class="pc" id="pcTop"></div>
    <div class="bwrap" id="bwrap">
      <div class="board" id="board">
        <div class="squares" id="squares"></div>
        <div class="pieces" id="pieces"></div>
      </div>
    </div>
    <div class="pc" id="pcBot"></div>
  </div>
  <div class="gbtns">
    <button class="btn white small" id="bUndo">↩️ Ångra</button>
    <button class="btn blue small" id="bHint">💡 Tips <span class="hintn" id="hintN">3</span></button>
    <button class="btn pink small" id="bResign">🏳️ Ge upp</button>
  </div>
</section>

<section id="stats" class="screen scroll">
  <div class="topbar"><button class="ibtn" data-back>⬅️</button><h2>Statistik 🏆</h2><span style="width:48px"></span></div>
  <div class="list" id="statsList"></div>
</section>

<section id="settings" class="screen scroll">
  <div class="topbar"><button class="ibtn" data-back>⬅️</button><h2>Inställningar</h2><span style="width:48px"></span></div>
  <div class="list" id="setList"></div>
  <input type="file" id="file" accept="image/*" hidden>
</section>

<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
<div id="party"></div>
<canvas id="confetti"></canvas>

<script src="shared/core.js"></script>
<script src="schack/engine.js"></script>
<script src="schack/app.js"></script>
</body>
</html>
