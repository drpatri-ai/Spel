<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bucinca Spel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bucinca">
<meta name="theme-color" content="#8B7BFF">
<link rel="stylesheet" href="shared/style.css">
<style>
body{background:linear-gradient(160deg,#FFB3D9 0%,#C9A7FF 40%,#7FD1FF 75%,#9BE38A 100%)}
#hub{justify-content:flex-start;overflow-y:auto;padding-top:calc(var(--safe-t) + 10px)}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(94vw,560px);padding-bottom:6px}
@media (min-aspect-ratio:5/4){.games{grid-template-columns:repeat(3,minmax(0,1fr));width:min(94vw,860px)}}
@media (min-width:900px) and (min-aspect-ratio:5/4){.games{grid-template-columns:repeat(4,minmax(0,1fr));width:min(96vw,1100px)}}
.game{--c:#FF8A3D;--d:#D9621A;background:var(--card);border-radius:26px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;
  box-shadow:0 6px 0 #C9C3E8;position:relative;transition:transform .15s;text-align:center;overflow:hidden}
.game:active{transform:scale(.95)}
.game .ic{width:clamp(70px,20vmin,110px);aspect-ratio:1;border-radius:24px;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));
  box-shadow:0 5px 0 var(--d);display:grid;place-items:center;font-size:clamp(38px,11vmin,60px);animation:hop 1.6s ease-in-out infinite}
.game:nth-child(2) .ic{animation-delay:.2s}.game:nth-child(3) .ic{animation-delay:.4s}.game:nth-child(4) .ic{animation-delay:.6s}.game:nth-child(5) .ic{animation-delay:.8s}.game:nth-child(6) .ic{animation-delay:1s}.game:nth-child(7) .ic{animation-delay:1.2s}.game:nth-child(8) .ic{animation-delay:1.4s}.game:nth-child(9) .ic{animation-delay:1.6s}.game:nth-child(10) .ic{animation-delay:1.8s}.game:nth-child(11) .ic{animation-delay:2s}.game:nth-child(12) .ic{animation-delay:2.2s}
.game b{font-size:clamp(18px,4.6vmin,24px)}
.game small{font-size:clamp(12px,3vmin,15px);color:var(--muted);line-height:1.2}
.game .best{font-size:clamp(12px,3vmin,14px);font-weight:600;color:var(--d)}
.game .new{position:absolute;top:10px;right:-28px;transform:rotate(35deg);background:#FF4D6D;color:#fff;font-size:12px;font-weight:700;padding:3px 30px}
.hubbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding-bottom:16px}
.hubbtns .btn{min-width:0}
.upbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:20;background:#2B2350;color:#fff;border-radius:18px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:10px;font-weight:600;box-shadow:0 6px 0 #0004;max-width:94vw}
.upbar .btn{min-width:0;padding:8px 14px;font-size:15px}
.tops{width:min(96vw,980px);margin-top:64px;padding-bottom:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.tcard{background:var(--card);border-radius:22px;padding:10px 12px;box-shadow:0 5px 0 #C9C3E8;display:flex;flex-direction:column;gap:6px}
.tcard h4{margin:0;font-size:17px}
.trow{display:flex;align-items:center;gap:8px;background:#F6F4FF;border-radius:12px;padding:4px 10px;font-weight:600}
.trow .av{width:30px;border-width:2px;flex:none}
.trow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow b{white-space:nowrap}
.trow.me{box-shadow:0 0 0 3px #FFD23F;background:#FFF8D6}
.trow span.m{flex:none;width:28px;text-align:center}
.tnote{grid-column:1/-1;text-align:center;color:#fff;font-weight:600;text-shadow:0 1px 0 #0006}
.figpick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.figpick button{border-radius:50%;padding:0;background:none}
.figpick .av{width:44px;border-width:3px;opacity:.55}
.figpick button.on .av{opacity:1;box-shadow:0 0 0 3px #FFD23F}
.nameIn{font:inherit;font-size:24px;font-weight:700;text-align:center;width:100%;border:3px solid #E4E0F7;border-radius:14px;padding:8px;-webkit-user-select:text;user-select:text}
#hub .logo .l1{font-size:clamp(44px,13vmin,96px)}
#hub .logo .l2{font-size:clamp(34px,10vmin,72px)}
#hub .dance .av{width:clamp(34px,7.5vmin,60px)}
@media (min-aspect-ratio:5/4) and (max-height:600px){
  #hub .logo{flex-direction:row;gap:14px;align-items:baseline}
  #hub .logo .l1{font-size:44px}#hub .logo .l2{font-size:40px}
  #hub .dance{display:none}
}
</style>
</head>
<body>
<div id="bg"></div>

<section id="hub" class="screen on">
  <div class="logo" id="logo"></div>
  <div class="dance" id="dance"></div>
  <div class="games" id="games"></div>
  <div class="hubbtns">
    <button class="btn green small" id="toTop">🏆 Topplista</button>
    <button class="btn purple small" id="toChars">🎭 Figurer</button>
    <button class="btn pink small" id="toSettings">⚙️ Ljud & vibration</button>
    <button class="btn blue small" id="toCode">🌍 Gå med med kod</button>
  </div>
</section>

<section id="top" class="screen scroll">
  <div class="topbar"><button class="ibtn" data-back>⬅️</button><h2>Topplista 🏆</h2><button class="ibtn" id="topRe">🔄</button></div>
  <div class="tops" id="topList"></div>
</section>

<section id="chars" class="screen scroll">
  <div class="topbar"><button class="ibtn" data-back>⬅️</button><h2>Figurer 🎭</h2><span style="width:48px"></span></div>
  <div class="list" id="charList"></div>
</section>

<section id="settings" class="screen scroll">
  <div class="topbar"><button class="ibtn" data-back>⬅️</button><h2>Inställningar</h2><span style="width:48px"></span></div>
  <div class="list" id="setList"></div>
</section>

<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
<div id="party"></div>
<canvas id="confetti"></canvas>

<script src="shared/core.js"></script>
<script src="shared/net.js"></script>
<script src="shared/hs.js"></script>
<script src="hub.js"></script>
</body>
</html>
